<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoroMC | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --blue-glow: #00d2ff;
            --dark-bg: #020b16;
            --discord: #5865F2;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Particles Canvas - Constellation Network Motion */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Card with Entry Animation */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(10, 20, 35, 0.4);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(0, 210, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 210, 255, 0.05);
            animation: slideUpFade 1s ease-out forwards, float 6s ease-in-out infinite 1s;
            opacity: 0;
            transform: translateY(30px);
            margin: 20px 0;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Logo Animation */
        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 210, 255, 0.3);
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.6));
            animation: pulse 3s infinite;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 30px rgba(0, 210, 255, 0.8)); transform: scale(1.03); }
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0 5px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff 0%, var(--blue-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        .owner-info {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--blue-glow);
            margin-bottom: 20px;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .desc {
            opacity: 0.8; 
            font-size: 0.95rem; 
            font-weight: 300;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Feature Chips */
        .features-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: default;
        }

        .chip:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--blue-glow);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        /* IP Box */
        .ip-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 210, 255, 0.5);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .ip-container:hover {
            background: rgba(0, 210, 255, 0.05);
            border-color: var(--blue-glow);
        }

        .ip-container p { 
            margin: 5px 0; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .ip-container span { 
            color: var(--blue-glow); 
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .copy-hint {
            display: block;
            margin-top: 8px;
            font-size: 0.75rem;
            opacity: 0.6;
            transition: 0.3s;
        }

        /* Discord Button */
        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--discord);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-discord:hover {
            background: #4752C4;
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.5);
            transform: translateY(-3px);
        }

        .btn-discord i {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-card">
        <img src="http://googleusercontent.com/image_collection/image_retrieval/16776789238450110154_0" alt="ZoroMC" class="logo-img" onerror="this.src='https://via.placeholder.com/120/020b16/00d2ff?text=ZM'">
        <h1>ZOROMC</h1>
        <div class="owner-info">SMARTGRAPH AKA GAURAV WADEKAR</div>
        
        <p class="desc">
            India's #1 Lifesteal & Economy Server. <br>Join the legend today.
        </p>

        <div class="features-container">
            <div class="chip">⚔️ Lifesteal</div>
            <div class="chip">💰 Economy</div>
            <div class="chip">🏢 Lobby</div>
            <div class="chip">🤺 PvP</div>
            <div class="chip">🎫 Events</div>
        </div>

        <div class="ip-container" onclick="copyIP(this)">
            <p><span>IP:</span> play.zoromc.qzz.io</p>
            <p><span>PORT:</span> 19107</p>
            <span class="copy-hint">(Click to copy to clipboard)</span>
        </div>

        <a href="https://discord.gg/JmF5Ru9BJ6" target="_blank" class="btn-discord">
            <i class="ph ph-discord-logo"></i> JOIN DISCORD
        </a>
    </div>

    <script>
        // Upgraded Constellation Particle System
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const connectionDistance = 120;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Bounce off edges smoothly
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(0, 210, 255, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles() {
            // Adjust particle count based on screen size so mobile isn't laggy
            let particleCount = Math.floor(window.innerWidth / 15);
            if (particleCount > 100) particleCount = 100;
            
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawLines() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        let opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${opacity * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            drawLines();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            init();
            createParticles();
        });

        // Initialize background
        init();
        createParticles();
        animate();

        // Smooth Copy Function
        function copyIP(element) {
            const ipString = "play.zoromc.qzz.io:19107";
            navigator.clipboard.writeText(ipString).then(() => {
                const hint = element.querySelector('.copy-hint');
                const originalText = hint.innerText;
                
                hint.innerText = "✓ Copied to clipboard!";
                hint.style.color = "#00d2ff";
                hint.style.opacity = "1";
                hint.style.fontWeight = "bold";

                setTimeout(() => {
                    hint.innerText = originalText;
                    hint.style.color = "";
                    hint.style.opacity = "0.6";
                    hint.style.fontWeight = "normal";
                }, 2000);
            }).catch(err => {
                console.error("Failed to copy", err);
            });
        }
    </script>
</body>
</html>
