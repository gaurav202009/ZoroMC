<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoroMC | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --blue-glow: #00d2ff;
            --dark-bg: #020b16;
            --discord: #5865F2;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Particles Canvas - Constellation Network Motion */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Glassmorphism Card with Entry Animation */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(10, 20, 35, 0.4);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(0, 210, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 210, 255, 0.05);
            animation: slideUpFade 1s ease-out forwards, float 6s ease-in-out infinite 1s;
            opacity: 0;
            transform: translateY(30px);
            margin: 20px 0;
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Logo Animation */
        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 210, 255, 0.3);
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.6));
            animation: pulse 3s infinite;
            margin-bottom: 10px;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.4)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 30px rgba(0, 210, 255, 0.8)); transform: scale(1.03); }
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0 5px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fff 0%, var(--blue-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        .owner-info {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--blue-glow);
            margin-bottom: 20px;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
        }

        .desc {
            opacity: 0.8; 
            font-size: 0.95rem; 
            font-weight: 300;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Feature Chips */
        .features-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: default;
        }

        .chip:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--blue-glow);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
        }

        /* IP Box */
        .ip-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 210, 255, 0.5);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .ip-container:hover {
            background: rgba(0, 210, 255, 0.05);
            border-color: var(--blue-glow);
        }

        .ip-container p { 
            margin: 5px 0; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .ip-container span { 
            color: var(--blue-glow); 
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .copy-hint {
            display: block;
