<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoroMC | Premium Experience</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --blue-glow: #00d2ff;
            --dark-bg: #020b16;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* No scroll for that app feel */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Particles Canvas - Real Motion */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
        }

        /* Glassmorphism Card with Neon Border */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Logo Animation */
        .logo-img {
            width: 110px;
            filter: drop-shadow(0 0 20px var(--blue-glow));
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        h1 {
            font-size: 2.5rem;
            margin: 15px 0 5px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, var(--blue-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .owner-info {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--blue-glow);
            margin-bottom: 25px;
            font-weight: bold;
            opacity: 0.8;
        }

        /* Feature Chips with Glass effect */
        .features-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .chip:hover {
            background: var(--blue-glow);
            color: #000;
            box-shadow: 0 0 15px var(--blue-glow);
        }

        /* IP Box */
        .ip-container {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed var(--blue-glow);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .ip-container p { margin: 5px 0; font-family: monospace; }
        .ip-container span { color: var(--blue-glow); }

        /* Discord Button */
        .btn-discord {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(45deg, #5865F2, #404eed);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 15px;
            font-weight: bold;
            transition: 0.4s;
        }

        .btn-discord:hover {
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.6);
            transform: scale(1.02);
        }

    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-card">
        <img src="http://googleusercontent.com/image_collection/image_retrieval/16776789238450110154_0" alt="ZoroMC" class="logo-img">
        <h1>ZOROMC</h1>
        <div class="owner-info">SMARTGRAPH AKA GAURAV WADEKAR</div>
        
        <p style="opacity: 0.8; font-size: 0.95rem; margin-bottom: 20px;">
            India's #1 Lifesteal & Economy Server. <br>Join the legend today.
        </p>

        <div class="features-container">
            <div class="chip">⚔️ Lifesteal</div>
            <div class="chip">💰 Economy</div>
            <div class="chip">🏢 Lobby</div>
            <div class="chip">🤺 PvP</div>
            <div class="chip">🎫 Events</div>
        </div>

        <div class="ip-container" onclick="copyIP()">
            <p><span>IP:</span> play.zoromc.qzz.io</p>
            <p><span>PORT:</span> 19107</p>
            <small style="font-size: 0.6rem; opacity: 0.5;">(Click to copy)</small>
        </div>

        <a href="https://discord.gg/JmF5Ru9BJ6" target="_blank" class="btn-discord">
            <i class="ph ph-discord-logo"></i> JOIN DISCORD
        </a>
    </div>

    <script>
        // Particle System for Motion Blue effect
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = 'rgba(0, 210, 255, ' + Math.random() * 0.5 + ')';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.001;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles() {
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].size <= 0.2) {
                    particles.splice(i, 1);
                    i--;
                    particles.push(new Particle());
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        createParticles();
        animate();

        function copyIP() {
            navigator.clipboard.writeText("play.zoromc.qzz.io:19107");
            alert("IP & Port Copied!");
        }
    </script>
</body>
</html>
